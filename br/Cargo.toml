[package]
name = "br"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.12", default-features = false }
dix = { version = "2.2", default-features = false }
fs2 = "0.4"
indicatif = "0.17"
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
yansi = { version = "1", features = ["detect-env", "detect-tty"] }

[lints.clippy]
pedantic = "warn"
